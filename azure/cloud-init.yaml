#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - python3-pip
  - python3-venv
  - ripgrep
  - unzip
  - zip
  - docker.io
write_files:
  - path: /etc/motd
    permissions: '0644'
    content: |
      KLTN research VM: npm/PyPI static analysis.
      Do not install, build, or execute packages under investigation.
      Keep malicious archives inside an isolated analysis container.
runcmd:
  - [systemctl, enable, --now, docker]
  - [install, -d, -o, azureuser, -g, azureuser, -m, '0750', /home/azureuser/kltn]
  - [sudo, -u, azureuser, python3, -m, venv, /home/azureuser/kltn/.venv]
final_message: 'KLTN base environment initialization finished after $UPTIME seconds.'
